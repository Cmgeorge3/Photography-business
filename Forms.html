<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photo Service Form</title>

  <style>

    body {
@import url('https://googleapis.com');
      font-family: 'bangers', "Comic Sans MS", Sans serif;
      margin: 0;
      padding: 20px;
    }

    /* Holds the form and image side-by-side */
    .page-container {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Form section */
    .form-container {
      flex: 1;
    }

    /* Image section */
    .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .right-image {
      width: 100%;
      max-width: 950px;
      height: 650px;
      object-fit: contain;
      border: 2px solid black;
    }
	  .discount-section {
  margin-top: 10px;
}

.discount-section h2 {
  margin: 0 0 8px 0;
}

.discount-section h5 {
  margin: 2px 0;
  font-size: 14px;
}

    /* Submit button */
    button {
      transition: background-color 1s ease;
      color: black;
      background-color: white;
      padding: 10px 20px;
      border: 5px solid black;
      cursor: pointer;
    }

    button:hover {
      background-color: cyan;
    }

    /* Makes the page work better on phones */
    @media (max-width: 800px) {
  .page-container {
    flex-direction: row;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
  }

  .form-container {
    flex: 1;
    min-width: 0;
  }

  .image-container {
    flex: 0 0 35%;
    width: 35%;
  }

  .right-image {
    width: 100%;
    height: auto;
    max-width: 100%;
    object-fit: contain;
  }

  table {
    width: 100%;
    font-size: 11px;
  }

  th,
  td {
    padding: 3px;
  }

  .form-container h2 {
    font-size: 16px;
  }

  .form-container h5 {
    font-size: 10px;
  }

  label,
  select,
  input,
  button {
    font-size: 11px;
  }

  input,
  select {
    max-width: 100%;
    box-sizing: border-box;
  }
}

    <!-- FORM ON THE LEFT -->
    <div class="form-container">

      <form action="https://formspree.io/f/xkjnlybg" method="POST">

        <table border="3">
          <tr>
            <th>Job Type</th>
            <th>Price $ per Task</th>
          </tr>

          <tr>
            <td>Full body/ Landscape (3)</td>
            <td>$8 </td>
          </tr>

          <tr>
            <td>Head-Shots(5)</td>
            <td>$15</td>
          </tr>
	  <tr>
            <td>Group-Photos(10)</td>
            <td>$20</td>
          </tr>

        </table>

	<div class="discount-section">

  <h2>
    Please contact me by phone to confirm a day for your photo session:
    (252)-499-0867
  </h2>

  <h5>Mary Jane Discount Qualification:</h5>

  <h5>
    Follow, Like, and Share a post on my Instagram page:
    <b>@spideys_view</b>
  </h5>

  <h5>Message me on Instagram when completed!</h5>

</div>
<br> <br>
       
        <b>
          <label for="jobType">Choose Photography Service:</label>
          <select id="jobType" name="jobType" required>
            <option value="">-- Select a Job --</option>
            <option value="Full-Body">Full Body</option>
            <option value="Headshot">Headshots</option>
	    <option value="Group">Group Photos</option>

          </select>
        </b>

        <br><br>

        <b>
          <label for="serviceTypes">
            Choose Photography Location:
          </label>

          <select id="serviceTypes" name="serviceTypes" required>
            <option value="">-- Select Service Type --</option>
            <option value="Come To Me">Come To Me</option>
            <option value="Come To You">
              Come To You
            </option>
          </select>
        </b>

       
        <br><br>

        <b>
          <label for="address">
            Address of Venue:
          </label>

          <input
            type="text"
            id="address"
            name="address"
            required
          >
        </b>


        <br><br>

        <b>
          <button type="submit">
            Submit Form
          </button>
        </b>

      </form>


    </div>


    <!-- IMAGE ON THE RIGHT -->
    <div class="image-container">

      <img
        src="Spideys_view_photo.png"
        alt="Spidey Service"
        class="right-image"
      >

    </div>

  </div>

</body>
</html>
